<!doctype html>
<html lang="en" style="background:#050308">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050308" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Personal offline gym workout tracker" />
    <link rel="icon" type="image/png" href="icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Gym Companion</title>
  </head>
  <body style="margin:0;background:#050308">
    <!--
      Startup screen. React replaces everything inside #root when the app starts.
      If it hasn't started after 6 seconds, or a script error happens first,
      the watchdog below shows what went wrong and a Reload button instead of
      leaving a black screen.
    -->
    <div id="root">
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:#050308;color:#a59cc0;font:15px/1.45 system-ui,sans-serif;text-align:center">
        <img src="icons/icon-192.png" width="76" height="76" alt="" style="border-radius:22px" />
        <div id="boot-msg" style="max-width:320px;min-height:22px"></div>
      </div>
    </div>
    <script>
      ;(function () {
        var errors = []
        function report() {
          var boot = document.getElementById('boot')
          if (!boot) return // app is running
          var msg = document.getElementById('boot-msg')
          msg.innerHTML = ''
          var p = document.createElement('p')
          p.style.margin = '0 0 12px'
          p.style.color = '#edeaf6'
          p.textContent = errors.length ? 'The app hit an error while starting.' : 'Still starting. This is taking longer than it should.'
          msg.appendChild(p)
          if (errors.length) {
            var pre = document.createElement('pre')
            pre.style.cssText = 'white-space:pre-wrap;text-align:left;font-size:12px;background:#100c1a;padding:10px;border-radius:10px;margin:0 0 14px;max-height:40vh;overflow:auto'
            pre.textContent = errors.slice(0, 3).join('\n\n')
            msg.appendChild(pre)
          }
          var b = document.createElement('button')
          b.textContent = 'Reload'
          b.style.cssText = 'border:0;border-radius:999px;padding:12px 28px;font:600 16px system-ui;background:#6620d0;color:#fff'
          b.onclick = function () { location.reload() }
          msg.appendChild(b)
        }
        window.addEventListener('error', function (e) {
          errors.push((e.message || 'Script error') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : ''))
          report()
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          errors.push('Unhandled: ' + (r && r.message ? r.message : String(r)))
          report()
        })
        setTimeout(report, 6000)
      })()
    </script>
    <noscript>Gym Companion needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
